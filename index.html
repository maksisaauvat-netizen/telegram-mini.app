<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Demo Games Mini App</title>
<style>
:root{
  --bg:#080b12;--card:#111722;--panel:#171e2b;--border:#273143;
  --text:#f5f7fb;--muted:#8c98aa;--accent:#6ee7b7;--accent-bg:#153a31;
  --danger:#fb7185;--danger-bg:#431923;--good:#4ade80;--good-bg:#123b29;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#05070b;color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:flex;justify-content:center}
button,input{font:inherit}
button{cursor:pointer}
#app{width:100%;max-width:480px;min-height:100vh;background:var(--bg);padding:14px 14px 88px}
.topbar{display:grid;grid-template-columns:42px 1fr 42px;gap:8px;align-items:center;margin-bottom:14px}
.icon,.avatar,.nav-btn,.chip,.game-card,.action,.seg button,.back{border:1px solid var(--border);background:var(--card);color:var(--text)}
.icon,.avatar,.back{width:42px;height:42px;border-radius:13px;display:grid;place-items:center}
.avatar{background:var(--accent-bg);color:var(--accent);font-weight:800}
.brand{text-align:center;font-weight:800}
.brand small{display:block;color:var(--muted);font-size:10px;font-weight:600;margin-top:2px}
.controls{display:flex;gap:7px;margin-bottom:14px}
.pill{flex:1;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:13px;padding:9px 8px;text-align:center;font-size:12px}
.pill b{display:block;color:var(--accent);font-size:13px;margin-top:2px}
.balance{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:13px 15px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.balance small{color:var(--muted);display:block;font-size:10px}
.balance strong{font-size:18px}
h2{font-size:18px;margin:10px 0 12px}
.muted{color:var(--muted)}
.games{display:grid;gap:10px}
.game-card{padding:15px;border-radius:17px;text-align:left;width:100%;transition:.15s}
.game-card:hover{transform:translateY(-1px);border-color:#3b4659}
.game-card .game-head{display:flex;justify-content:space-between;align-items:center}
.game-card strong{font-size:18px}
.game-card p{margin:7px 0 0;color:var(--muted);font-size:12px}
.badge{font-size:10px;color:var(--accent);background:var(--accent-bg);padding:5px 7px;border-radius:8px}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:10px;text-align:center}
.stat small{display:block;color:var(--muted);font-size:9px;margin-bottom:4px}
.stat b{font-size:14px}
.input{width:100%;border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:11px;padding:11px;outline:none}
.chips{display:flex;gap:7px;margin-top:9px}
.chip{flex:1;border-radius:9px;padding:8px 4px;font-size:11px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.action{border-radius:13px;padding:13px;font-weight:800}
.primary{background:var(--accent);color:#07130f;border-color:var(--accent)}
.secondary{background:var(--panel)}
.status{text-align:center;min-height:19px;margin:11px 0;color:var(--muted);font-size:12px}
.good{color:var(--accent)!important}.bad{color:var(--danger)!important}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);padding:9px 14px 12px;background:rgba(8,11,18,.94);backdrop-filter:blur(12px);display:grid;grid-template-columns:1fr 1fr;gap:8px;border-top:1px solid var(--border);z-index:10}
.nav-btn{border-radius:13px;padding:10px;color:var(--muted)}
.nav-btn.active{color:var(--accent);background:var(--accent-bg);border-color:#285b4d}
.chart{height:190px;background:var(--panel);border:1px solid var(--border);border-radius:17px;padding:10px;margin-bottom:12px}
.chart svg{width:100%;height:100%}
.mult{text-align:center;font-size:34px;font-weight:900;margin:-2px 0 10px}
.seg{display:grid;grid-template-columns:1fr 1fr;margin-bottom:10px}
.seg button{padding:9px;border-radius:10px}
.seg button.active{background:var(--accent-bg);color:var(--accent);border-color:#285b4d}
.progress{display:flex;gap:5px;margin-bottom:12px}
.progress i{height:4px;flex:1;border-radius:10px;background:var(--border)}
.progress i.done{background:var(--accent)}
.tower{display:flex;flex-direction:column;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:14px;margin-bottom:12px}
.level{display:grid;grid-template-columns:45px repeat(3,1fr);gap:8px;align-items:center}
.levelnum{color:var(--muted);font-size:10px;text-align:center}
.cell{height:46px;border:1px solid var(--border);border-radius:11px;background:var(--panel);color:var(--text);font-size:17px}
.cell.safe{border-color:var(--good);background:var(--good-bg)}.cell.mine{border-color:var(--danger);background:var(--danger-bg)}
.mines{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:12px;margin-bottom:12px}
.minecell{aspect-ratio:1;border:1px solid var(--border);border-radius:10px;background:var(--panel);color:var(--text);font-size:17px}
.minecell.safe{background:var(--good-bg);border-color:var(--good)}.minecell.bomb{background:var(--danger-bg);border-color:var(--danger)}
.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.profile-item{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px}
.profile-item small{display:block;color:var(--muted);font-size:9px;margin-bottom:5px}.profile-item b{font-size:14px}
.wallet-big{text-align:center;padding:18px}.wallet-big strong{display:block;font-size:32px}.wallet-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
.note{font-size:10px;color:var(--muted);text-align:center;margin-top:13px;line-height:1.4}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="app"></div>
<script>
const app=document.getElementById('app');
let lang='RU',currency='USDT',balance=250;
let screen='games',game=null;
let crash={playing:false,mult:1,stake:10,auto:2};
let mines={playing:false,stake:10,count:5,revealed:[],bombs:[]};
let tower={playing:false,level:0,stake:10,mult:1,path:[]};
const rubRate=95;

function money(n){return currency==='USDT'?n.toFixed(2)+' USDT':(n*rubRate).toFixed(2)+' RUB'}
function t(ru,en){return lang==='RU'?ru:en}
function header(title){
 return `<div class="topbar">
   <button class="back" onclick="goGames()">‹</button>
   <div class="brand">${title}<small>DEMO GAME</small></div>
   <button class="avatar" onclick="openProfile()">U</button>
 </div>`;
}
function controls(){
 return `<div class="controls">
   <button class="pill" onclick="toggleLang()">RU / EN<b>${lang}</b></button>
   <button class="pill" onclick="toggleCurrency()">USDT / RUB<b>${currency}</b></button>
 </div>`;
}
function balanceBox(){return `<div class="balance"><div><small>${t('БАЛАНС','BALANCE')}</small><strong>${money(balance)}</strong></div><span>●</span></div>`}
function nav(){
 return `<div class="bottom">
  <button class="nav-btn ${screen==='games'?'active':''}" onclick="goGames()">🎮 ${t('Играть','Play')}</button>
  <button class="nav-btn ${screen==='wallet'?'active':''}" onclick="openWallet()">◉ ${t('Кошелек','Wallet')}</button>
 </div>`;
}
function render(){
 let body='';
 if(screen==='games') body=games();
 if(screen==='crash') body=crashView();
 if(screen==='mines') body=minesView();
 if(screen==='tower') body=towerView();
 if(screen==='wallet') body=walletView();
 if(screen==='profile') body=profileView();
 app.innerHTML=body+nav();
}
function games(){
 return `<div class="topbar"><div></div><div class="brand">GAME HUB<small>DEMO MINI APP</small></div><button class="avatar" onclick="openProfile()">U</button></div>
 ${controls()}${balanceBox()}
 <h2>${t('Играть','Play')}</h2>
 <div class="games">
  <button class="game-card" onclick="openGame('crash')"><div class="game-head"><strong>CRASH</strong><span class="badge">1.00x+</span></div><p>${t('Забери выигрыш до краша','Cash out before the crash')}</p></button>
  <button class="game-card" onclick="openGame('mines')"><div class="game-head"><strong>MINES</strong><span class="badge">5 × 5</span></div><p>${t('Открывай безопасные клетки','Reveal safe cells')}</p></button>
  <button class="game-card" onclick="openGame('tower')"><div class="game-head"><strong>TOWER</strong><span class="badge">6.00x</span></div><p>${t('Поднимайся по уровням','Climb the tower')}</p></button>
 </div>
 <div class="note">${t('Демо-интерфейс. Реальные денежные операции не выполняются.','Demo interface. No real-money transactions are performed.')}</div>`;
}
function gameControls(obj,setter){
 return `<div class="card"><small class="muted">${t('РАЗМЕР СТАВКИ','STAKE')}</small><input class="input" type="number" min="1" value="${obj.stake}" ${obj.playing?'disabled':''} onchange="${setter}(this.value)">
 <div class="chips">${[5,10,25,50].map(x=>`<button class="chip" onclick="${setter}(${x})">${x}</button>`).join('')}</div></div>`;
}
function crashView(){
 return header('CRASH')+controls()+`
 <div class="card row"><div><small class="muted">РАУНД</small><b>#${48291}</b></div><div style="text-align:right"><small class="muted">${t('СТАТУС','STATUS')}</small><b id="cstatus">${crash.playing?t('Игра идёт','Running'):t('Готов','Ready')}</b></div></div>
 <div class="chart"><svg viewBox="0 0 400 180"><path d="M0 160 C70 155 80 120 130 130 S190 70 240 85 S300 30 400 18" fill="none" stroke="#6ee7b7" stroke-width="4"/><path d="M0 160 C70 155 80 120 130 130 S190 70 240 85 S300 30 400 18 L400 180 L0 180Z" fill="rgba(110,231,183,.08)"/></svg></div>
 <div class="mult" id="cmult">${crash.mult.toFixed(2)}x</div>
 ${gameControls(crash,'setCrashStake')}
 <div class="card"><div class="seg"><button class="active">${t('Одиночная','Single')}</button><button>${t('Авто','Auto')}</button></div><div class="row"><span class="muted">${t('Автозабор','Auto cashout')}</span><b>${crash.auto.toFixed(2)}x</b></div></div>
 <div class="actions"><button class="action primary" onclick="${crash.playing?'cashCrash()':'startCrash()'}">${crash.playing?t('ЗАБРАТЬ '+money(crash.stake*crash.mult),'CASH OUT '+money(crash.stake*crash.mult)):t('НАЧАТЬ ИГРУ','START GAME')}</button><button class="action secondary" onclick="goGames()">${t('ИГРЫ','GAMES')}</button></div>
 <div id="cmsg" class="status">${t('Демо-раунд без реальных ставок','Demo round — no real bets')}</div>`;
}
let crashTimer;
function setCrashStake(v){if(!crash.playing){crash.stake=Math.max(1,Number(v)||1);render()}}
function startCrash(){
 if(crash.stake>balance)return crashMsg(t('Недостаточно демо-баланса','Not enough demo balance'),'bad');
 balance-=crash.stake;crash.playing=true;crash.mult=1;render();
 clearInterval(crashTimer);crashTimer=setInterval(()=>{
   crash.mult+=0.03+Math.random()*0.07;
   if(crash.mult>=crash.auto){cashCrash();return}
   const m=document.getElementById('cmult');if(m)m.textContent=crash.mult.toFixed(2)+'x';
   const s=document.getElementById('cstatus');if(s)s.textContent=t('Игра идёт','Running');
 },300);
}
function cashCrash(){
 if(!crash.playing)return;
 clearInterval(crashTimer);let payout=crash.stake*crash.mult;balance+=payout;crash.playing=false;
 render();crashMsg(t('Забрано '+money(payout),'Cashed out '+money(payout)),'good');
}
function crashMsg(msg,cl){const e=document.getElementById('cmsg');if(e){e.textContent=msg;e.className='status '+cl}}

function minesView(){
 const cells=Array.from({length:25},(_,i)=>{
  let cls='minecell',txt='';if(mines.revealed.includes(i)){cls+=' safe';txt='◆'}
  if(!mines.playing&&mines.bombs.includes(i)&&mines.revealed.length){cls+=' bomb';txt='×'}
  return `<button class="${cls}" onclick="pickMine(${i})" ${!mines.playing?'disabled':''}>${txt}</button>`
 }).join('');
 return header('MINES')+controls()+`
 <div class="stats"><div class="stat"><small>СТАВКА</small><b>${money(mines.stake)}</b></div><div class="stat"><small>${t('МИНЫ','MINES')}</small><b>${mines.count}</b></div><div class="stat"><small>COEF.</small><b>${(1+mines.revealed.length*.28).toFixed(2)}x</b></div></div>
 <div class="mines">${cells}</div>
 ${gameControls(mines,'setMineStake')}
 <div class="card"><div class="row"><span class="muted">${t('Безопасных клеток','Safe cells')}</span><b>${mines.revealed.length}/25</b></div></div>
 <div class="actions"><button class="action primary" onclick="${mines.playing?'cashMines()':'startMines()'}">${mines.playing?t('ЗАБРАТЬ '+money(mines.stake*(1+mines.revealed.length*.28)),'CASH OUT'):t('НАЧАТЬ ИГРУ','START GAME')}</button><button class="action secondary" onclick="goGames()">${t('ИГРЫ','GAMES')}</button></div>
 <div id="mmsg" class="status">${t('Выбери ставку и начни игру','Choose a stake and start')}</div>`;
}
function setMineStake(v){if(!mines.playing){mines.stake=Math.max(1,Number(v)||1);render()}}
function startMines(){
 if(mines.stake>balance)return;
 balance-=mines.stake;mines.playing=true;mines.revealed=[];
 mines.bombs=[];while(mines.bombs.length<mines.count){let x=Math.floor(Math.random()*25);if(!mines.bombs.includes(x))mines.bombs.push(x)}
 render();
}
function pickMine(i){
 if(!mines.playing)return;
 if(mines.bombs.includes(i)){
   mines.playing=false;render();document.getElementById('mmsg').textContent=t('Мина! Демо-раунд завершён','Mine! Demo round ended');document.getElementById('mmsg').className='status bad';return;
 }
 if(!mines.revealed.includes(i))mines.revealed.push(i);
 render();
 if(mines.revealed.length===25-mines.count)cashMines();
}
function cashMines(){
 if(!mines.playing)return;
 let payout=mines.stake*(1+mines.revealed.length*.28);balance+=payout;mines.playing=false;render();
 document.getElementById('mmsg').textContent=t('Забрано '+money(payout),'Cashed out '+money(payout));document.getElementById('mmsg').className='status good';
}

function towerView(){
 let rows=[5,4,3,2,1].map(l=>{
   let cells=[0,1,2].map(i=>`<button class="cell" ${tower.playing&&l===tower.level+1?'':'disabled'} onclick="pickTower(${l},${i})">${tower.playing?'?':'?'}</button>`).join('');
   return `<div class="level" data-l="${l}"><div class="levelnum">LVL ${l}</div>${cells}</div>`;
 }).join('');
 return header('TOWER')+controls()+`
 <div class="stats"><div class="stat"><small>СТАВКА</small><b>${money(tower.stake)}</b></div><div class="stat"><small>COEF.</small><b>${tower.mult.toFixed(2)}x</b></div><div class="stat"><small>${t('ВЫИГРЫШ','WIN')}</small><b>${money(tower.stake*tower.mult)}</b></div></div>
 <div class="progress">${[0,1,2,3,4].map(i=>`<i class="${i<tower.level?'done':''}"></i>`).join('')}</div>
 <div class="tower">${rows}</div>
 ${gameControls(tower,'setTowerStake')}
 <div class="actions"><button class="action primary" onclick="${tower.playing?'cashTower()':'startTower()'}">${tower.playing?t('ЗАБРАТЬ '+money(tower.stake*tower.mult),'CASH OUT'):t('НАЧАТЬ ИГРУ','START GAME')}</button><button class="action secondary" onclick="goGames()">${t('ИГРЫ','GAMES')}</button></div>
 <div id="tmsg" class="status">${t('Выбери ставку и начни подъём','Choose a stake and start climbing')}</div>`;
}
function setTowerStake(v){if(!tower.playing){tower.stake=Math.max(1,Number(v)||1);render()}}
function startTower(){
 if(tower.stake>balance)return;
 balance-=tower.stake;tower.playing=true;tower.level=0;tower.mult=1;tower.path=Array.from({length:5},()=>Math.floor(Math.random()*3));render();
}
function pickTower(l,i){
 if(!tower.playing||l!==tower.level+1)return;
 const row=document.querySelector(`.level[data-l="${l}"]`),cells=row.querySelectorAll('.cell');
 if(i!==tower.path[l-1]){
   cells[i].classList.add('mine');cells[i].textContent='×';cells[tower.path[l-1]].classList.add('safe');cells[tower.path[l-1]].textContent='✓';
   tower.playing=false;render();document.getElementById('tmsg').textContent=t('Неверный путь — раунд завершён','Wrong path — round ended');document.getElementById('tmsg').className='status bad';return;
 }
 cells[i].classList.add('safe');cells[i].textContent='✓';tower.level++;tower.mult=[1.35,1.85,2.65,3.9,6][tower.level-1];
 if(tower.level===5){let p=tower.stake*tower.mult;balance+=p;tower.playing=false;render();document.getElementById('tmsg').textContent=t('Башня пройдена: '+money(p),'Tower cleared: '+money(p));document.getElementById('tmsg').className='status good';}
 else render();
}
function cashTower(){if(!tower.playing)return;let p=tower.stake*tower.mult;balance+=p;tower.playing=false;render();document.getElementById('tmsg').textContent=t('Забрано '+money(p),'Cashed out '+money(p));document.getElementById('tmsg').className='status good'}

function walletView(){
 return `<div class="topbar"><div></div><div class="brand">${t('КОШЕЛЕК','WALLET')}<small>DEMO</small></div><button class="avatar" onclick="openProfile()">U</button></div>
 ${controls()}<div class="card wallet-big"><small class="muted">${t('ТЕКУЩИЙ БАЛАНС','CURRENT BALANCE')}</small><strong>${money(balance)}</strong><div class="wallet-actions"><button class="action primary" onclick="demoWallet()">${t('ПОПОЛНИТЬ','DEPOSIT')}</button><button class="action secondary" onclick="demoWallet()">${t('ВЫВЕСТИ','WITHDRAW')}</button></div></div>
 <div class="card"><div class="row"><span class="muted">${t('Операции','Transactions')}</span><span class="badge">DEMO</span></div><p class="muted" style="font-size:12px">${t('Здесь будут отображаться операции после подключения серверной части.','Transactions will appear here after backend integration.')}</p></div>`;
}
function demoWallet(){alert(t('Демо: денежные операции отключены.','Demo: money operations are disabled.'))}
function profileView(){
 return `<div class="topbar"><button class="back" onclick="goGames()">‹</button><div class="brand">${t('ПРОФИЛЬ','PROFILE')}<small>DEMO</small></div><div class="avatar">U</div></div>
 ${controls()}<div class="card" style="text-align:center;padding:20px"><div class="avatar" style="margin:auto;width:64px;height:64px;font-size:22px">U</div><h2 style="margin-bottom:2px">User</h2><span class="muted">ID: 123456789</span></div>
 <div class="profile-grid">
 ${[['Баланс',money(balance)],['User ID','123456789'],['Всего ставок','0'],['Оборот','0.00'],['Всего выиграно','0.00'],['Лучший множитель','0.00x']].map(x=>`<div class="profile-item"><small>${t(x[0],x[0])}</small><b>${x[1]}</b></div>`).join('')}
 </div><div class="note">${t('Статистика демонстрационная.','Statistics are demo-only.')}</div>`;
}
function openGame(g){screen=g;render()}
function goGames(){screen='games';render()}
function openWallet(){screen='wallet';render()}
function openProfile(){screen='profile';render()}
function toggleLang(){lang=lang==='RU'?'EN':'RU';render()}
function toggleCurrency(){currency=currency==='USDT'?'RUB':'USDT';render()}
render();
</script>
</body>
</html>
